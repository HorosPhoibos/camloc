<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M6Cam - Audit Cam (V1.3)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #camera-container, #preview-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 70vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #preview-container {
            display: none;
        }

        /* Kontainer untuk Input dan Tombol Clear */
        #input-wrapper {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        /* Styling untuk Input Nama Barang */
        #item-input {
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 40px 12px 15px; /* Padding kanan lebih besar untuk tempat tombol X */
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            backdrop-filter: blur(4px);
            outline: none;
            transition: border-color 0.2s;
        }

        #item-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #item-input:focus {
            border-color: #ffffff;
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Tombol Clear 'X' */
        #clear-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            display: none; /* Disembunyikan secara default */
            line-height: 1;
            width: auto;
            border-radius: 0;
            font-weight: normal;
        }

        #clear-btn:hover {
            color: white;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button.main-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #capture-btn {
            background-color: #ffffff;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 4px solid #121212;
            outline: 3px solid #ffffff;
            padding: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #capture-btn:active { background-color: #e0e0e0; transform: scale(0.95); }

        .action-btn {
            background-color: #ffffff;
            color: #121212;
            display: none;
        }

        .action-btn.secondary { 
            background-color: #333333; 
            color: #ffffff;
        }
        
        .action-btn:active { transform: scale(0.95); }
        
        #status-text {
            position: absolute;
            top: 10px;
            font-size: 13px;
            color: #888;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 20px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="status-text">Mencari lokasi & kamera...</div>

    <!-- Live Camera Feed -->
    <div id="camera-container">
        <!-- Input Wrapper untuk Nama Barang dan Tombol X -->
        <div id="input-wrapper">
            <input type="text" id="item-input" placeholder="UNIT ID / Nama Barang..." autocomplete="off">
            <button id="clear-btn" aria-label="Clear text">&times;</button>
        </div>
        <video id="video" autoplay playsinline></video>
    </div>

    <!-- Captured Image Preview -->
    <div id="preview-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Buttons -->
    <div class="controls">
        <button id="capture-btn"></button>
        <button id="retake-btn" class="main-btn action-btn secondary">Retake</button>
        <button id="save-btn" class="main-btn action-btn">Save</button>
        <button id="share-btn" class="main-btn action-btn">Share</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const itemInput = document.getElementById('item-input');
        const clearBtn = document.getElementById('clear-btn');
        
        const captureBtn = document.getElementById('capture-btn');
        const shareBtn = document.getElementById('share-btn');
        const saveBtn = document.getElementById('save-btn');
        const retakeBtn = document.getElementById('retake-btn');
        
        const cameraContainer = document.getElementById('camera-container');
        const previewContainer = document.getElementById('preview-container');
        const statusText = document.getElementById('status-text');

        let currentLocation = "Mencari lokasi...";
        let capturedBlob = null;

        // --- Fitur Hapus Cepat (Clear Input) ---
        itemInput.addEventListener('input', () => {
            if (itemInput.value.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }
        });

        clearBtn.addEventListener('click', () => {
            itemInput.value = '';
            clearBtn.style.display = 'none';
            itemInput.focus(); // Mengembalikan kursor ke kotak input
        });

        // 1. Dapatkan Lokasi GPS dan ubah ke Alamat
        navigator.geolocation.getCurrentPosition(
            (pos) => { 
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                currentLocation = `${lat.toFixed(4)}, ${lon.toFixed(4)}`; 
                statusText.innerText = "Mencari nama jalan...";

                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.address) {
                            const addr = data.address;
                            const street = addr.road || addr.pedestrian || addr.suburb || "";
                            const city = addr.city || addr.town || addr.village || addr.county || "";
                            
                            let readableAddress = [];
                            if(street) readableAddress.push(street);
                            if(city) readableAddress.push(city);
                            
                            if(readableAddress.length > 0) {
                                currentLocation = readableAddress.join(', ');
                            }
                        }
                        statusText.innerText = "";
                    })
                    .catch(err => {
                        console.error("Geocoding error:", err);
                        statusText.innerText = ""; 
                    });
            },
            (err) => { 
                console.warn("Location error:", err);
                statusText.innerText = "";
                currentLocation = "Lokasi tidak tersedia";
            }
        );

        // 2. Mulai Kamera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                statusText.innerText = "Akses kamera ditolak.";
                console.error(err);
            });

        // 3. Ambil Foto
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Gambar frame video
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const baseFontSize = Math.max(16, Math.floor(canvas.width / 45)); 
            const padding = baseFontSize * 2;

            // --- BAGIAN ATAS: Cetak Nama Barang ---
            const itemText = itemInput.value.trim();
            if (itemText !== "") {
                const topGradientHeight = baseFontSize * 6;
                const topGradient = ctx.createLinearGradient(0, 0, 0, topGradientHeight);
                topGradient.addColorStop(0, 'rgba(0,0,0,0.7)');
                topGradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = topGradient;
                ctx.fillRect(0, 0, canvas.width, topGradientHeight);

                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${baseFontSize * 1.3}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
                
                let displayItem = "ITEM: " + itemText;
                const maxTextWidth = canvas.width - (padding * 2);
                if (ctx.measureText(displayItem).width > maxTextWidth) {
                    while (ctx.measureText(displayItem + "...").width > maxTextWidth && displayItem.length > 0) {
                        displayItem = displayItem.slice(0, -1);
                    }
                    displayItem += "...";
                }
                
                ctx.fillText(displayItem, padding, padding);
            }

            // --- BAGIAN BAWAH: Cetak Waktu & Lokasi ---
            const bottomGradientHeight = baseFontSize * 8;
            const bottomGradient = ctx.createLinearGradient(0, canvas.height - bottomGradientHeight, 0, canvas.height);
            bottomGradient.addColorStop(0, 'rgba(0,0,0,0)');
            bottomGradient.addColorStop(0.4, 'rgba(0,0,0,0.4)');
            bottomGradient.addColorStop(1, 'rgba(0,0,0,0.8)');
            
            ctx.fillStyle = bottomGradient;
            ctx.fillRect(0, canvas.height - bottomGradientHeight, canvas.width, bottomGradientHeight);

            // Waktu & Tanggal
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            ctx.textAlign = "left";
            ctx.textBaseline = "bottom";

            // Draw Waktu
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${baseFontSize * 1.8}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            ctx.fillText(timeStr, padding, canvas.height - padding - (baseFontSize * 2.5));

            // Draw Tanggal
            ctx.font = `500 ${baseFontSize * 1.1}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            ctx.fillText(dateStr, padding, canvas.height - padding - (baseFontSize * 1));

            // Draw Lokasi
            ctx.font = `400 ${baseFontSize * 0.9}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            
            let displayLocation = currentLocation;
            if (ctx.measureText(displayLocation).width > (canvas.width - (padding * 2))) {
                while (ctx.measureText(displayLocation + "...").width > (canvas.width - (padding * 2)) && displayLocation.length > 0) {
                    displayLocation = displayLocation.slice(0, -1);
                }
                displayLocation += "...";
            }
            
            ctx.fillText(displayLocation, padding, canvas.height - padding);

            // Sembunyikan UI
            cameraContainer.style.display = 'none';
            captureBtn.style.display = 'none';
            statusText.style.display = 'none';
            
            previewContainer.style.display = 'flex';
            retakeBtn.style.display = 'block';
            saveBtn.style.display = 'block';
            shareBtn.style.display = 'block';

            canvas.toBlob((blob) => { capturedBlob = blob; }, 'image/jpeg', 0.95);
        });

        // 4. Retake Photo
        retakeBtn.addEventListener('click', () => {
            previewContainer.style.display = 'none';
            retakeBtn.style.display = 'none';
            saveBtn.style.display = 'none';
            shareBtn.style.display = 'none';
            
            cameraContainer.style.display = 'flex';
            captureBtn.style.display = 'block';
            statusText.style.display = 'block';
            capturedBlob = null;
        });

        // 5. Save Photo to Gallery/Downloads
        saveBtn.addEventListener('click', () => {
            if (!capturedBlob) return;
            
            const url = URL.createObjectURL(capturedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `M6Cam_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
        });

        // 6. Share Photo
        shareBtn.addEventListener('click', async () => {
            if (!capturedBlob) return;
            const file = new File([capturedBlob], `M6Cam_${Date.now()}.jpg`, { type: "image/jpeg" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: 'Foto M6Cam', files: [file] });
                } catch (err) { console.log("Share failed:", err); }
            } else {
                alert("Browser ini tidak mendukung fitur Share langsung. Silakan gunakan tombol Save.");
            }
        });
    </script>
</body>
</html>
